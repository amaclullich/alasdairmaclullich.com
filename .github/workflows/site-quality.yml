name: Site quality
on:
  push:
  pull_request:
  schedule:
    - cron: '23 5 * * 1'
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - run: npm install --package-lock=false
      - run: npx browser-driver-manager install chrome
      - run: npm run check
      - run: npx html-validate "**/*.html"
      - run: python3 -m http.server 8080 --directory . > /tmp/site-server.log 2>&1 & npx wait-on http://127.0.0.1:8080/ && npx axe http://127.0.0.1:8080/ http://127.0.0.1:8080/delirium/ http://127.0.0.1:8080/research/ http://127.0.0.1:8080/books/ http://127.0.0.1:8080/books/delirium-family-guide/ http://127.0.0.1:8080/media/ http://127.0.0.1:8080/about/ http://127.0.0.1:8080/social/ http://127.0.0.1:8080/contact/ http://127.0.0.1:8080/privacy/ http://127.0.0.1:8080/accessibility/ http://127.0.0.1:8080/buy/4at-manual/?stay
